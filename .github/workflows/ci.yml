name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Check all modules (${{ matrix.toolchain }}, ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [latest, nightly]
        target: [wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        env:
          MOONBIT_INSTALL_VERSION: ${{ matrix.toolchain }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Validate library, generator, and both examples
        env:
          MOONBIT_TEST_TARGET: ${{ matrix.target }}
        run: |
          moon version --all
          moon update
          ./check.sh
